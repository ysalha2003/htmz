<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}} | HTMZ Kit</title>
  <link rel="stylesheet" href="/design.css">
  <script src="/kit.js" defer></script>
</head>
<body>
  <a class="ds-skip" href="#main">تجاوز إلى المحتوى الرئيسي</a>
  <div class="ds-shell">
    <header class="ds-topbar">
      <a class="ds-brand" href="/" aria-label="الرئيسية">
        <span class="ds-brand-mark" aria-hidden="true">H</span>
        <span><strong>HTMZ Kit</strong><small>واجهة بسيطة. هندسة واضحة.</small></span>
      </a>
      <div class="ds-topbar-end">
        <span class="ds-tag">Backend Agnostic</span>
        <span class="ds-avatar" aria-label="حساب تجريبي">د</span>
      </div>
    </header>
    <main id="main" class="ds-main">
      <div class="ds-page-heading">
        <div>
          <p class="ds-eyebrow">WORKSPACE / PROJECTS</p>
          <h1>المشاريع</h1>
          <p class="ds-muted">لوحة تجريبية مبنية على HTML عادي: كل رابط صفحة كاملة، وطبقة تحسين اختيارية واحدة.</p>
        </div>
        <span class="ds-pill">3 مشاريع تجريبية</span>
      </div>
      <div class="ds-layout">
        <aside class="ds-card ds-sidebar" aria-label="قائمة المشاريع">
          {{PROJECT_LIST}}
        </aside>
        <div class="ds-content">
          {{PROJECT_PANEL}}
        </div>
      </div>
      <footer class="ds-footer">
        <span>بيانات اصطناعية · تصميم RTL · دون مكتبات تشغيل</span>
      </footer>
    </main>
  </div>
</body>
</html>
